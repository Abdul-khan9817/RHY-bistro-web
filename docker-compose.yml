version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: rhy-bistro-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rhy-bistro
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rhy-bistro-app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/rhy-bistro
      - DB_NAME=rhy-bistro
      - JWT_SECRET=change-this-jwt-secret-to-a-secure-random-32-chars-key
      - CORS_ORIGIN=http://localhost:3001,http://localhost:5173
    depends_on:
      - mongodb

volumes:
  mongo-data:
